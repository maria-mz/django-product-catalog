<form method="get">
    {{ form.query }}
    {{ form.category }}
    <button type="submit">Search</button>
    {% if request.GET %}
        <a href="{% url 'products' %}">Clear</a>
    {% endif %}
</form>

<ul>
    {% for product in products %}
    <li>{{ product.description }}</li>
    {% empty %}
    <li>No products found</li>
    {% endfor %}
</ul>
